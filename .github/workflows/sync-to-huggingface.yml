name: Sync to Hugging Face

on:
  push:
    branches: [main]
    paths: [contributions.jsonl]
  workflow_dispatch: {}

permissions:
  id-token: write  # required to mint the OIDC token exchanged for a short-lived HF token
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the hf CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Push contributions.jsonl to the Hugging Face dataset repo
        env:
          # datasets/<owner>/<dataset> — set via a repository variable, no secret needed.
          # A Trusted Publisher must be configured on that dataset repo's
          # Settings > Trusted Publishers with provider "GitHub Actions" and
          # claims repository=imattau/nostrhost-contributions, branch=main,
          # workflow=sync-to-huggingface.yml.
          HF_OIDC_RESOURCE: ${{ vars.HF_DATASET_RESOURCE }}
        run: |
          if [ -z "$HF_OIDC_RESOURCE" ]; then
            echo "::error::repository variable HF_DATASET_RESOURCE is not set (expected datasets/<owner>/<dataset>)"
            exit 1
          fi
          hf upload "${HF_OIDC_RESOURCE#datasets/}" contributions.jsonl contributions.jsonl \
            --repo-type dataset \
            --commit-message "Sync from imattau/nostrhost-contributions@${GITHUB_SHA:0:12}"
